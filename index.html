<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DHMusic V3</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="home">

  <div class="bg-glow glow-one"></div>
  <div class="bg-glow glow-two"></div>

  <main class="hero-card">
    <div class="badge">PRIVATE BETA</div>

    <h1>DHMusic <span>V3</span></h1>
    <p class="subtitle">Enhanced audio player experience</p>

    <div class="player-preview">
      <div class="disc">
        <div class="disc-core"></div>
      </div>

      <div class="track-info">
        <p class="label">Now Ready</p>
        <h2>Start Session</h2>

        <div class="wave">
          <i></i><i></i><i></i><i></i><i></i><i></i><i></i>
        </div>
      </div>
    </div>

    <button class="start-btn" onclick="mulai()">
      START
    </button>

    <p class="footer-note">Tap start to initialize DHMusic V3</p>
  </main>

  <script>
    function mulai() {
      window.location.href = "prank.html";
    }
  </script>

</body>
</html>
